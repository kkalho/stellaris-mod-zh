name: 工坊发布（workshop-upload）

# 用途：把群星离线快照版上传到 Steam 创意工坊（本地 steamcmd 因网络不可用时走此通道）。
# 前置：仓库 Secrets 里配置 STEAM_USERNAME / STEAM_PASSWORD（绝不写入代码或日志）。
# 流程：重建知识库 → 生成快照与 vdf → docker 内 steamcmd 上传。
# Steam 令牌：第一次运行会触发 Valve 发码（邮箱/手机），把收到的 5 位码填进本输入再跑一次；
# 之后每次发布都重复「跑一次 → 收码 → 带码再跑一次」（云端登录无会话保持）。

on:
  workflow_dispatch:
    inputs:
      steam_guard_code:
        description: 'Steam 令牌码（5 位）。首次运行保持默认值触发 Valve 发码；用邮箱/手机收到的码再跑第二次'
        required: true
        default: '00000'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 重建知识库并体检
        run: |
          pip install pypinyin
          python scripts/rebuild_all.py
          python scripts/verify_db.py

      - name: 生成工坊快照
        run: python scripts/export_workshop_snapshot.py

      - name: 生成 workshop.vdf（Linux 路径版）
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('.')
          desc = (base / 'dist/workshop/description.txt').read_text(encoding='utf-8')
          item_id = ''
          idf = base / 'data/stellaris/workshop_item_id.json'
          if idf.exists():
              item_id = str(json.loads(idf.read_text(encoding='utf-8')).get('publishedfileid', ''))
          esc = desc.replace('\\', '\\\\').replace('"', '\\"')
          exported = json.loads((base / 'data/stellaris/workshop_version.json').read_text(encoding='utf-8'))['exported_at']
          vdf = (
              '"workshopitem"\n{\n'
              '    "appid"             "281990"\n'
              f'    "publishedfileid"   "{item_id}"\n'
              '    "contentfolder"     "/work/content"\n'
              '    "previewfile"       "/work/content/og_card.png"\n'
              '    "visibility"        "0"\n'
              '    "title"             "群星 MOD 中文图鉴（离线查询手册 · 持续更新）"\n'
              f'    "description"       "{esc}"\n'
              f'    "changenote"        "数据快照 {exported}：Top 1020 中文数据"\n'
              '}\n')
          Path('workshop.vdf').write_text(vdf, encoding='utf-8')
          print('workshop.vdf 生成完毕，publishedfileid =', repr(item_id))
          PY
          mkdir -p content
          cp dist/workshop/index.html content/
          cp web/og_card.png content/og_card.png

      - name: steamcmd 上传（首次运行不带码=触发 Valve 发码）
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_GUARD_CODE: ${{ inputs.steam_guard_code }}
        run: |
          docker run --rm -i \
            -e STEAM_USERNAME -e STEAM_PASSWORD -e STEAM_GUARD_CODE \
            -v "$GITHUB_WORKSPACE:/work" \
            cm2network/steamcmd:latest \
            bash -c 'if [ -z "$STEAM_GUARD_CODE" ] || [ "$STEAM_GUARD_CODE" = "00000" ]; then
                       /home/steam/steamcmd/steamcmd.sh +login "$STEAM_USERNAME" "$STEAM_PASSWORD" +quit
                     else
                       /home/steam/steamcmd/steamcmd.sh +login "$STEAM_USERNAME" "$STEAM_PASSWORD" "$STEAM_GUARD_CODE" +workshop_build_item /work/workshop.vdf +quit
                     fi' 2>&1 | tee /tmp/steamcmd.log
          if [ -z "$STEAM_GUARD_CODE" ] || [ "$STEAM_GUARD_CODE" = "00000" ]; then
            if grep -qi "Steam Guard" /tmp/steamcmd.log; then
              echo "✅ 已触发 Valve 发码：请查收邮箱/手机上的 5 位码，用它作为输入再运行一次"
            else
              echo "⚠ 未看到 Steam Guard 提示——请检查上方日志中账号密码是否正确"; exit 1
            fi
          else
            grep -i "published file id" /tmp/steamcmd.log || { echo "⚠ 未找到 published file id，请查看上方日志"; exit 1; }
          fi
